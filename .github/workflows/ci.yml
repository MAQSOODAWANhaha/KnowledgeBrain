name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - name: format
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace --no-fail-fast

  bidding-v2-live:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: knowledgebrain
          POSTGRES_PASSWORD: knowledgebrain
          POSTGRES_DB: knowledgebrain
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U knowledgebrain -d knowledgebrain"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://knowledgebrain:knowledgebrain@127.0.0.1:5432/knowledgebrain
      REDIS_URL: redis://127.0.0.1:6379
      KNOWLEDGEBRAIN_REQUIRE_POSTGRES_TESTS: "1"
      KNOWLEDGEBRAIN_REQUIRE_REDIS_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - name: install runtime identities
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGPASSWORD: knowledgebrain
          POSTGRES_USER: knowledgebrain
          POSTGRES_DB: knowledgebrain
          KNOWLEDGEBRAIN_MIGRATOR_PASSWORD: migrator-ci
          KNOWLEDGEBRAIN_API_DB_PASSWORD: api-ci
          KNOWLEDGEBRAIN_WORKER_DB_PASSWORD: worker-ci
          KNOWLEDGEBRAIN_RETENTION_DB_PASSWORD: retention-ci
        run: sh deploy/postgres-init/010-runtime-identities.sh
      - name: fresh V2 schema acceptance
        run: scripts/fresh_schema_acceptance.sh
      - name: V2 deletion scan
        run: scripts/bidding_v2_deletion_scan.sh
      - name: V2 focused contracts
        run: |
          cargo test -p bidding --test authoring_schema_contracts -- --nocapture
          cargo test -p bidding --test bidding_v2_baseline_contract -- --nocapture
          cargo test -p bidding --test tender_document_process_v2 -- --nocapture
      - name: API and worker tests
        run: cargo test -p api -p worker --no-fail-fast -- --nocapture

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: lint
        run: npm run lint --prefix web
      - name: authoring unit contracts
        run: npm test --prefix web
      - name: build
        run: npm run build --prefix web

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r services/docreader/requirements.txt
      - name: pytest
        run: python -m pytest services/docreader

  deploy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose config
        run: docker compose --profile runtime config --quiet
      - name: shell syntax
        run: bash -n scripts/bidding_v2_deletion_scan.sh scripts/fresh_schema_acceptance.sh deploy/postgres-init/010-runtime-identities.sh deploy/compose-runtime-restart.sh
