name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - name: format
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace --no-fail-fast

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: lint
        run: npm run lint --prefix web
      - name: authoring unit contracts
        run: npm test --prefix web
      - name: build
        run: npm run build --prefix web

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r services/docreader/requirements.txt
      - name: pytest
        run: python -m pytest services/docreader

  images:
    needs: [rust, web, python]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
      - name: Image prefix
        run: echo "IMAGE_PREFIX=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.rust
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_PREFIX }}/api:latest
          build-args: |
            BIN=api
            CARGO_MIRROR=none
            APT_MIRROR=none
          cache-from: type=gha,scope=rust-runtime
          cache-to: type=gha,mode=max,scope=rust-runtime
      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.rust
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_PREFIX }}/worker:latest
          build-args: |
            BIN=worker
            CARGO_MIRROR=none
            APT_MIRROR=none
          cache-from: type=gha,scope=rust-runtime
          cache-to: type=gha,mode=max,scope=rust-runtime
      - name: Build and push migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.rust
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_PREFIX }}/migrator:latest
          build-args: |
            BIN=migrator
            CARGO_MIRROR=none
            APT_MIRROR=none
          cache-from: type=gha,scope=rust-runtime
          cache-to: type=gha,mode=max,scope=rust-runtime
      - name: Build and push docreader
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.docreader
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_PREFIX }}/docreader:latest
          build-args: |
            APT_MIRROR=none
          cache-from: type=gha,scope=docreader
          cache-to: type=gha,mode=max,scope=docreader
      - name: Published images
        run: |
          {
            echo "### GHCR images"
            echo ""
            echo "- \`${IMAGE_PREFIX}/api:latest\`"
            echo "- \`${IMAGE_PREFIX}/worker:latest\`"
            echo "- \`${IMAGE_PREFIX}/migrator:latest\`"
            echo "- \`${IMAGE_PREFIX}/docreader:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
