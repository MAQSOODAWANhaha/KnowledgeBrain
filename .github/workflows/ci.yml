name: CI

on:
  pull_request:
  push:
    # One workflow run per PR commit: pull_request covers PR heads, and push
    # covers only CI_PUSH_BRANCH. GitHub cannot read the default branch inside
    # `on:`. scripts/ci_check_sources.sh fails when CI_PUSH_BRANCH is not that
    # default branch. Images still publish only on the default branch.
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  # The latest run replaces older CI runs across PR and main push events.
  group: ci-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  rust-build:
    # CI_RUNNER. Later jobs reuse the alias. runs-on cannot read env.
    runs-on: &runner ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Load CI config
        run: bash scripts/ci_load_config.sh
      - name: Toolchain matches rust-toolchain.toml
        run: grep -Fq "channel = \"${RUST_TOOLCHAIN}\"" rust-toolchain.toml
      - name: Config matches the repository
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/ci_check_sources.sh
      - name: createdb retry after ready
        run: bash scripts/tests/ci_services_createdb_retry_test.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: ${{ env.RUST_COMPONENTS }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ env.RUST_CACHE_SHARED_KEY }}
          cache-on-failure: false
      - name: format
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: tests
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/workspace-tests.log"
          cargo test --locked --workspace --no-fail-fast 2>&1 | tee "$log"
      - name: runtime binaries
        run: |
          set -euo pipefail
          cargo build --locked -p "$CI_API_BIN" -p "$CI_WORKER_BIN"
          cargo build --locked -p "$CI_PLATFORM_PACKAGE" --bin "$CI_MIGRATOR_BIN"
      - name: Package dev binaries and integration tests
        run: bash scripts/ci_package_binaries.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CI_ARTIFACT_NAME }}
          path: ${{ env.CI_BIN_DIR }}
          if-no-files-found: error
          retention-days: ${{ env.CI_ARTIFACT_RETENTION_DAYS }}

  postgres-acceptance:
    needs: rust-build
    runs-on: *runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Load CI config
        run: bash scripts/ci_load_config.sh
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.CI_ARTIFACT_NAME }}
          path: ${{ env.CI_BIN_DIR }}
      - name: Bind packaged binaries
        run: bash scripts/ci_bind_binaries.sh
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: PostgreSQL client
        run: |
          if ! command -v psql >/dev/null || ! command -v createdb >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Start PostgreSQL and Redis
        run: |
          export CI_POSTGRES_USER="$CI_SCHEMA_POSTGRES_USER"
          export CI_POSTGRES_PASSWORD="$CI_SCHEMA_POSTGRES_PASSWORD"
          export CI_POSTGRES_DB="$CI_APP_POSTGRES_DB"
          bash scripts/ci_services.sh start both
      - name: Apply pending business migrations
        run: |
          export DATABASE_URL="postgres://${CI_APP_POSTGRES_USER}:${CI_APP_POSTGRES_PASSWORD}@${CI_POSTGRES_HOST}:${CI_POSTGRES_PORT}/${CI_APP_POSTGRES_DB}"
          "$KB_MIGRATOR_BIN"
      - name: Knowledge generation and durable outbox fault acceptance
        run: |
          set -euo pipefail
          export KNOWLEDGEBRAIN_TEST_DATABASE_URL="postgres://${CI_APP_POSTGRES_USER}:${CI_APP_POSTGRES_PASSWORD}@${CI_POSTGRES_HOST}:${CI_POSTGRES_PORT}/${CI_APP_POSTGRES_DB}"
          export KNOWLEDGEBRAIN_TEST_ADMIN_DATABASE_URL="postgres://${CI_SCHEMA_POSTGRES_USER}:${CI_SCHEMA_POSTGRES_PASSWORD}@${CI_POSTGRES_HOST}:${CI_POSTGRES_PORT}/${CI_APP_POSTGRES_DB}"
          # Queue failure is deliberate: durable database obligations must survive it.
          export REDIS_URL="redis://127.0.0.1:1/"
          for test_name in $CI_KNOWLEDGE_WORKFLOW_TESTS; do
            log="$RUNNER_TEMP/${test_name}.log"
            bash scripts/ci_run_packaged_test.sh "$test_name" "$log" -- --ignored --test-threads=1 --nocapture
          done
      - name: Knowledge vector index publication acceptance
        run: |
          export KNOWLEDGEBRAIN_REQUIRE_POSTGRES_TESTS=1
          export KNOWLEDGEBRAIN_TEST_DATABASE_URL="postgres://${CI_APP_POSTGRES_USER}:${CI_APP_POSTGRES_PASSWORD}@${CI_POSTGRES_HOST}:${CI_POSTGRES_PORT}/${CI_APP_POSTGRES_DB}"
          bash scripts/ci_run_packaged_test.sh vector_index_postgres "$RUNNER_TEMP/vector-index.log" --unfiltered -- --test-threads=1
      - name: User and API key ownership isolation
        run: |
          export DATABASE_URL="postgres://${CI_APP_POSTGRES_USER}:${CI_APP_POSTGRES_PASSWORD}@${CI_POSTGRES_HOST}:${CI_POSTGRES_PORT}/${CI_APP_POSTGRES_DB}"
          export KNOWLEDGEBRAIN_KNOWLEDGE_ENABLED=true
          export OBJECT_DIR="$RUNNER_TEMP/owner-access-objects"
          mkdir -p "$OBJECT_DIR"
          bash scripts/ci_run_packaged_test.sh owner_access_postgres "$RUNNER_TEMP/owner-access.log" -- --ignored --test-threads=1
      - name: Stop services
        if: always()
        run: bash scripts/ci_services.sh stop

  schema-contract:
    needs: rust-build
    runs-on: *runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Load CI config
        run: bash scripts/ci_load_config.sh
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.CI_ARTIFACT_NAME }}
          path: ${{ env.CI_BIN_DIR }}
      - name: Bind packaged binaries
        run: bash scripts/ci_bind_binaries.sh
      - name: PostgreSQL client
        run: |
          if ! command -v psql >/dev/null || ! command -v createdb >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Start PostgreSQL
        run: |
          export CI_POSTGRES_USER="$CI_SCHEMA_POSTGRES_USER"
          export CI_POSTGRES_PASSWORD="$CI_SCHEMA_POSTGRES_PASSWORD"
          export CI_POSTGRES_DB="$CI_SCHEMA_POSTGRES_DB"
          bash scripts/ci_services.sh start postgres
      - name: Migration initialization, upgrade and recovery acceptance
        run: |
          set -euo pipefail
          export PGHOST="$CI_POSTGRES_HOST" PGPORT="$CI_POSTGRES_PORT"
          export PGUSER="$CI_SCHEMA_POSTGRES_USER" PGPASSWORD="$CI_SCHEMA_POSTGRES_PASSWORD"
          bash scripts/ci_services.sh createdb -T template0 "$CI_FRESH_DATABASE"
          trap 'dropdb --if-exists --force "$CI_FRESH_DATABASE"' EXIT
          export KNOWLEDGEBRAIN_FRESH_TEST_DATABASE_URL="postgres://${CI_APP_POSTGRES_USER}:${CI_APP_POSTGRES_PASSWORD}@${CI_POSTGRES_HOST}:${CI_POSTGRES_PORT}/${CI_FRESH_DATABASE}"
          export KNOWLEDGEBRAIN_REQUIRE_FRESH_DATABASE_TEST=1
          bash scripts/ci_run_packaged_test.sh "$CI_FRESH_TEST" "$RUNNER_TEMP/${CI_FRESH_TEST}.log" --unfiltered -- --test-threads=1
      - name: Stop services
        if: always()
        run: bash scripts/ci_services.sh stop

  queue-faults:
    needs: rust-build
    runs-on: *runner
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Load CI config
        run: bash scripts/ci_load_config.sh
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.CI_ARTIFACT_NAME }}
          path: ${{ env.CI_BIN_DIR }}
      - name: Bind packaged binaries
        run: bash scripts/ci_bind_binaries.sh
      - name: Start Redis
        run: bash scripts/ci_services.sh start redis
      - name: Required native Oxana faults against isolated Redis
        run: |
          set -euo pipefail
          unset OXANA_NATIVE_FAULTS_CHILD
          export KNOWLEDGEBRAIN_REQUIRE_REDIS_TESTS=1
          export REDIS_URL="redis://${CI_POSTGRES_HOST}:${CI_REDIS_PORT}/"
          log="$RUNNER_TEMP/queue-faults.log"
          bash scripts/ci_run_packaged_test.sh "$CI_OXANA_TEST" "$log" --unfiltered -- --test-threads=1 --nocapture
          if grep -Eq 'skip oxana native faults:|skip runtime test' "$log"; then
            echo "required native Oxana fault tests skipped execution" >&2
            exit 1
          fi
      - name: Preserve native fault evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: queue-faults-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/queue-faults.log
          if-no-files-found: error
      - name: Stop services
        if: always()
        run: bash scripts/ci_services.sh stop

  web:
    runs-on: *runner
    steps:
      - uses: actions/checkout@v7
      - name: Load CI config
        run: bash scripts/ci_load_config.sh
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: lint
        run: npm run lint --prefix web
      - name: authoring unit contracts
        run: npm test --prefix web
      - name: build
        run: npm run build --prefix web

  python:
    runs-on: *runner
    defaults:
      run:
        working-directory: services/docreader
    steps:
      - uses: actions/checkout@v7
      - name: Load CI config
        working-directory: .
        run: bash scripts/ci_load_config.sh
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: sync
        run: uv sync --frozen
      - name: Start isolated Python workflow database
        working-directory: .
        run: |
          export CI_POSTGRES_USER="$CI_APP_POSTGRES_USER"
          export CI_POSTGRES_PASSWORD="$CI_APP_POSTGRES_PASSWORD"
          export CI_POSTGRES_DB="$CI_APP_POSTGRES_DB"
          bash scripts/ci_services.sh start both
          echo "TENDER_TEST_DSN=postgres://${CI_APP_POSTGRES_USER}:${CI_APP_POSTGRES_PASSWORD}@${CI_POSTGRES_HOST}:${CI_POSTGRES_PORT}/${CI_APP_POSTGRES_DB}" >> "$GITHUB_ENV"
          echo "TENDER_TEST_DATABASE_URL=postgres://${CI_APP_POSTGRES_USER}:${CI_APP_POSTGRES_PASSWORD}@${CI_POSTGRES_HOST}:${CI_POSTGRES_PORT}/${CI_APP_POSTGRES_DB}" >> "$GITHUB_ENV"
          echo "TENDER_TEST_REDIS_URL=redis://${CI_POSTGRES_HOST}:${CI_REDIS_PORT}/15" >> "$GITHUB_ENV"
      - name: pytest
        run: |
          set -euo pipefail
          uv run pytest ${CI_DOCREADER_PYTEST_PATHS:?}
      - name: Stop isolated Python services
        if: always()
        working-directory: .
        run: bash scripts/ci_services.sh stop

  images:
    needs: [rust-build, postgres-acceptance, schema-contract, queue-faults, web, python]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: *runner
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v7
      - name: Load CI config
        run: bash scripts/ci_load_config.sh
      - name: Image prefix
        run: echo "IMAGE_PREFIX=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.rust
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_PREFIX }}/api:latest
          build-args: |
            BIN=${{ env.CI_API_BIN }}
            CARGO_MIRROR=none
            APT_MIRROR=none
          cache-from: type=gha,scope=rust-runtime
          cache-to: type=gha,mode=max,scope=rust-runtime
      - name: Build and push worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.rust
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_PREFIX }}/worker:latest
          build-args: |
            BIN=${{ env.CI_WORKER_BIN }}
            CARGO_MIRROR=none
            APT_MIRROR=none
          cache-from: type=gha,scope=rust-runtime
          cache-to: type=gha,mode=max,scope=rust-runtime
      - name: Build and push migrator
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.rust
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_PREFIX }}/migrator:latest
          build-args: |
            BIN=${{ env.CI_MIGRATOR_BIN }}
            CARGO_MIRROR=none
            APT_MIRROR=none
          cache-from: type=gha,scope=rust-runtime
          cache-to: type=gha,mode=max,scope=rust-runtime
      - name: Build and push docreader
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.docreader
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_PREFIX }}/docreader:latest
          build-args: |
            APT_MIRROR=none
          cache-from: type=gha,scope=docreader
          cache-to: type=gha,mode=max,scope=docreader
      - name: Published images
        run: |
          {
            echo "### GHCR images"
            echo ""
            echo "- \`${IMAGE_PREFIX}/api:latest\`"
            echo "- \`${IMAGE_PREFIX}/worker:latest\`"
            echo "- \`${IMAGE_PREFIX}/migrator:latest\`"
            echo "- \`${IMAGE_PREFIX}/docreader:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
