name: Python tender standalone
on:
  pull_request:
    paths:
      - 'services/docreader/**'
      - 'deploy/Dockerfile.docreader'
      - '.dockerignore'
      - '.github/workflows/python-tender.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tender_test
          POSTGRES_PASSWORD: tender-test-local-only
          POSTGRES_DB: tender_phase1_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tender_test -d tender_phase1_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      TENDER_TEST_DATABASE_URL: postgresql://tender_test:tender-test-local-only@127.0.0.1:5432/tender_phase1_test
      TENDER_TEST_DSN: postgresql://tender_test:tender-test-local-only@127.0.0.1:5432/tender_phase1_test
      TENDER_TEST_REDIS_URL: redis://127.0.0.1:6379/1
      TENDER_REDIS_URL: redis://127.0.0.1:6379/1
    defaults:
      run:
        working-directory: services/docreader
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen pytest tests/unit tests/workflow tests/acceptance -q
      - run: uv build --wheel
