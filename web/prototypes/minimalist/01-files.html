<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>文件列表</title>
  <link rel="stylesheet" href="proto.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="mark">KB</div>
      <nav class="nav">
        <a href="#">投标项目</a>
        <a class="on" href="#">知识资产</a>
      </nav>
      <div class="spacer"></div>
    </header>
    <aside class="side">
      <nav class="tree">
        <div class="row">公司资料</div>
        <div class="row">产品线</div>
        <div class="row d1 on">态势监管BU</div>
        <div class="row d2 on">NGSOC</div>
        <div class="row d3 on">当前</div>
      </nav>
    </aside>
    <div class="main">
      <div class="head">
        <div class="crumbs">
          知识资产 <span class="sep">/</span>
          <a href="#">产品线</a> <span class="sep">/</span>
          <a href="#">态势监管BU</a> <span class="sep">/</span>
          <a href="#">NGSOC</a> <span class="sep">/</span>
          当前
        </div>
        <h1 class="h1">当前</h1>
      </div>
      <div class="wrap">
        <div class="panel">
          <div class="toolbar">
            <span class="tab on">文件 2</span>
          </div>
          <p class="note">点文件名打开详情。解析进度写在行上，不是单独一步。</p>
          <div class="list">
            <div class="item">
              <div class="name">奇安信网神安全分析与管理系统V4.0 用户手册 V1.pdf</div>
              <span class="badge">可检索</span>
              <span class="meta">818 块</span>
            </div>
            <div class="item">
              <div class="name">云安全管理平台V2.0.6SP1-产品白皮书.docx</div>
              <span class="badge warn">摘要待重跑</span>
              <span class="meta">47 块</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
