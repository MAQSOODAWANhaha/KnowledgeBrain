[package]
name = "platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true


[dependencies]
async-trait = "0.1"
aws-sdk-s3 = { version = "1.146.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
chrono.workspace = true
dotenvy.workspace = true
hex.workspace = true
jsonwebtoken.workspace = true
libc.workspace = true
oxana.workspace = true
redis = { workspace = true, features = ["aio", "tokio-comp"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer = "0.3.2"
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
jsonschema = { version = "0.18.3", default-features = false, features = ["draft202012"] }

[[bin]]
name = "migrator"
path = "src/bin/migrator.rs"
