[package]
name = "worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "worker"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum.workspace = true
chunker = { path = "../chunker" }
clone = { path = "../clone" }
docparser = { path = "../docparser" }
dotenvy.workspace = true
bid = { path = "../bid" }
domain = { path = "../domain" }
enrichment = { path = "../enrichment" }
graph = { path = "../graph" }
index = { path = "../index" }
models = { path = "../models" }
obs = { path = "../obs" }
oxana.workspace = true
runtime = { path = "../runtime" }
serde_json.workspace = true
sqlx.workspace = true
storage = { path = "../storage" }
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
wiki = { path = "../wiki" }

[dev-dependencies]
storage = { path = "../storage", features = ["first-launch-migration"] }
