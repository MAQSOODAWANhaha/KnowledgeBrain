[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/auth",
  "crates/models",
  "crates/runtime",
  "crates/api",
  "crates/docparser",
  "crates/chunker",
  "crates/index",
  "crates/enrichment",
  "crates/graph",
  "crates/wiki",
  "crates/clone",
  "crates/search",
  "crates/bid",
  "crates/obs",
  "crates/storage",
  "crates/worker",
  "crates/retention",
  "crates/migrator",
  "crates/first-launch-verifier",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
axum = { version = "0.8", features = ["multipart", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1.36", default-features = false, features = ["std"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "fs"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
http = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "rust_decimal"] }
oxana = { version = "2.1", default-features = false, features = ["macros"] }
oxana-web = "2.1"
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
tokio-stream = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "blocking"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }
base64 = "0.22"
redis = { version = "1", default-features = false, features = ["script"] }
hmac = "0.13"
