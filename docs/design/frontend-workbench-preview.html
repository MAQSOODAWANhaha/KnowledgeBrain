<body>
  <div class="prototype"><strong>交互草图 · 示例数据</strong><span>离线布局预览，未连接业务服务</span><span class="optional">· 所有资料、章节及缺口均为合成示例</span></div>

  <section class="project" aria-labelledby="project-title">

    </div>

  <script>
    const chapters = {
      business: {
        title: '1. 投标人基本情况', volume: '商务分册', page: 1,
        intro: '规定表单与真实证明分别保留。企业资料尚未提供时，先保留原格式及待填位置。',
        body: `<section class="doc-section" id="loc-business"><h3>投标人基本情况表 <span class="source-mark">示例规定表单</span></h3><table class="doc-table"><tr><th>填写项目</th><th>投标人信息</th></tr><tr><td>企业名称</td><td class="pending">　　　　　　　　　</td></tr><tr><td>注册地址</td><td class="pending">　　　　　　　　　</td></tr><tr><td>统一社会信用代码</td><td class="pending">　　　　　　　　　</td></tr></table><p class="fine-print">空白为待填位置。此表为布局合成示例，不代表本项目真实规定格式。</p></section>`,
        requirement: '按规定格式填写企业基本信息，并提供有效主体证明。',
        support: '当前仅有示例表单结构；尚未提供企业名称、登记信息及主体证明原件。',
        gap: '补充企业基本信息与主体证明', target: 'loc-business'
      },
      overview: {
        title: '1. 项目理解与建设目标', volume: '技术分册', page: 2,
        intro: '以下示例正文用于展示阅读密度、来源提示和待补位置，不作为真实投标承诺。',
        body: `<section class="doc-section" id="loc-background"><h3>1.1 项目背景 <span class="source-mark">招标原文 · 示例</span></h3><p>本项目拟建设园区综合服务平台，统一服务入口，汇集现有业务信息，为日常服务、事项办理与运行管理提供支撑。</p><p>建设内容围绕业务协同和信息共享展开，并保留与既有系统对接的能力。具体对接范围应以项目确认的接口清单为依据。</p></section><section class="doc-section" id="loc-goals"><h3>1.2 建设目标</h3><p>围绕统一入口、业务协同与运行可视三个方向组织建设内容，保留本项目规定的安全、实施及验收要求。</p><div class="blank" id="loc-interface"><strong>待补：既有系统对接边界</strong><br>尚未取得接口范围和现状资料。本位置保留待补，不把拟议对接能力写成已核实事实。</div></section>`,
        requirement: '说明项目背景、建设目标及与既有系统的衔接边界；具体范围需有资料支撑。',
        support: '招标文件示例 §2.1 项目概况、§3.2 建设要求。此处仅演示来源关系，没有读取真实招标文件。',
        gap: '补充既有系统与接口范围', target: 'loc-interface'
      },
      response: {
        title: '2. 技术要求响应表', volume: '技术分册', page: 3,
        intro: '规定表格与生成应答并列展示。要求原文、实际应答和支持资料分别核对。',
        body: `<section class="doc-section" id="loc-response"><h3>技术要求响应表 <span class="source-mark">示例规定表单</span></h3><table class="doc-table"><tr><th>序号</th><th>要求摘要</th><th>本次响应</th></tr><tr><td>1</td><td>统一服务入口</td><td>按业务事项组织入口与导航。<br><span class="muted">合成响应示例</span></td></tr><tr><td>2</td><td>对接既有业务系统</td><td class="pending" id="loc-parameter">待补：接口范围及适用资料</td></tr><tr><td>3</td><td>提供实施计划</td><td class="pending">待补：获授权的实施安排</td></tr></table></section><p class="fine-print">表格有内容不等于要求已满足；资料命中也不代表已完成语义核对。</p>`,
        requirement: '逐项响应适用技术要求，保留必要的条件、例外与规定表格。',
        support: '统一入口示例资料可供核对；接口范围与实施承诺暂无可用依据，不自动补造。',
        gap: '补充接口范围与实施安排', target: 'loc-parameter'
      },
      evidence: {
        title: '3. 相关证明附件', volume: '技术分册', page: 4,
        intro: '证明应采用可核对的真实原件，并保留与响应位置的关联。',
        body: `<section class="doc-section" id="loc-evidence"><h3>3.1 相关证明材料</h3><div class="blank"><strong>待提供：适用于本次响应的证明原件</strong><br>当前示例没有企业证书、报告或其他证明原件。保留附件位置，不使用生成文字代替真实证明。</div><p class="fine-print">原件应在正式产品中查看和下载；本草图不提供虚构证明文件。</p></section>`,
        requirement: '按项目规定提供适用证明，并放入对应的交付位置。',
        support: '暂无可判断适用性的证明原件；资料名称或检索片段不能代替证明本身。',
        gap: '提供适用证明原件', target: 'loc-evidence'
      },
      price: {
        title: '1. 开标报价表', volume: '报价分册', page: 5,
        intro: '最终单价、总价及折扣由人工填写。未知价格保留空白，不自动按零处理。',
        body: `<section class="doc-section" id="loc-price"><h3>开标报价表 <span class="source-mark">人工填写 · 示例</span></h3><table class="doc-table"><tr><th>项目</th><th>数量</th><th>单价（元）</th><th>金额（元）</th></tr><tr><td>平台建设服务</td><td>1 项</td><td class="pending">　　　　　</td><td class="pending">　　　　　</td></tr><tr><td colspan="3">投标总报价</td><td class="pending">　　　　　</td></tr></table><div class="blank" style="margin-top:18px"><strong>人工待填：本次投标报价</strong><br>不沿用历史价格，不自动计算虚假的完整总价。其他分册仍可继续编制。</div></section>`,
        requirement: '按规定报价表填报本次投标金额，保留固定项目和格式。',
        support: '当前只有示例表格骨架；本次价格尚未人工填报。',
        gap: '人工填写本次投标报价', target: 'loc-price'
      }
    };
    const pageKeys = ['business', 'overview', 'response', 'evidence', 'price'];
    const outlineDetails = {
      business: ['记录投标主体基本信息', '原表 · 人工填写', '1'],
      overview: ['说明项目理解及建设目标', '正文', '1'],
      response: ['逐项呈现技术要求与实际响应', '原表 · 响应内容', '2'],
      evidence: ['安放适用的真实证明原件', '附件', '1'],
      price: ['保留本次投标的人工报价位置', '原表 · 人工报价', '1']
    };
    let currentChapter = 'overview', currentContext = 'requirements', currentPage = 2;
    let demoState = 'saved', currentVersion = 'v3', viewingNewDemo = false;
    const reviewVersion = 'v3';
    const workspace = document.querySelector('#workspace');
    const scroll = document.querySelector('#document-scroll');
    const dialog = document.querySelector('#info-dialog');
    function showDialog(title, body) {
      document.querySelector('#dialog-title').textContent = title;
      document.querySelector('#dialog-body').innerHTML = body;
      dialog.showModal();
    }
    function renderDocument() {
      const chapter = chapters[currentChapter];
      const heading = `<h2 class="doc-heading">${chapter.title}</h2><p class="doc-intro">${chapter.intro}</p>`;
      if (demoState === 'before') {
        let previousVolume = '';
        const rows = pageKeys.map(key => {
          const item = chapters[key], detail = outlineDetails[key];
          const group = previousVolume !== item.volume ? `<tr><th colspan="4">${item.volume}</th></tr>` : '';
          previousVolume = item.volume;
          return `${group}<tr id="${item.target}"><td>${item.title}</td><td>${detail[0]}</td><td>${detail[1]}</td><td class="pending">${detail[2]}</td></tr>`;
        }).join('');
        scroll.innerHTML = `<article class="content-card"><div class="chapter-path">生成前状态 · 合成示例</div><h2 class="doc-heading">首份 Word 尚未生成</h2><p class="doc-intro">先展示文件大纲和任务进度。尚无稿件时不摆放空白 Word 编辑器；此处不代表真实任务正在执行。</p><ol class="progress-steps"><li>结构组织：示例已完成</li><li><strong>依据准备与编写：示例进行中</strong></li><li>Word 稿件：示例尚未产出</li></ol><table class="doc-table"><thead><tr><th>交付位置</th><th>用途</th><th>形式</th><th>待补</th></tr></thead><tbody>${rows}</tbody></table><p class="fine-print">后续状态通过上方“草图状态演示”手动选择，不自动假定生成成功。</p></article>`;
      } else {
        scroll.innerHTML = `<div class="word-controls"><button id="previous-page" ${currentPage === 1 ? 'disabled' : ''}>上一页</button><span>示例稿 ${currentVersion} · 第 ${currentPage} / 5 页</span><button id="next-page" ${currentPage === 5 ? 'disabled' : ''}>下一页</button></div><article class="paper"><div class="paper-header"><span>园区综合服务平台建设项目</span><span>${chapter.volume}</span></div><div class="paper-content">${heading}${chapter.body}</div><footer class="paper-footer"><span>示例稿 ${currentVersion} · Word 布局草图</span><span>— ${currentPage} —</span></footer></article><p class="word-hint">中心仅模拟 Word 稿件位置，未接真实 ONLYOFFICE。${viewingNewDemo ? '当前只演示切换版本，内容未实际重新生成。' : '实际产品直接在此阅读与编辑 Word。'}</p>`;
        document.querySelector('#previous-page').onclick = () => selectChapter(pageKeys[currentPage - 2]);
        document.querySelector('#next-page').onclick = () => selectChapter(pageKeys[currentPage]);
      }
      scroll.scrollTop = 0;
    }
    function renderState() {
      const pendingVersion = `v${Number(currentVersion.slice(1)) + 1}`;
      const statuses = {
        before: '示例状态：生成前 · 尚无首份 Word',
        saved: `示例状态：阅读已保存稿 ${currentVersion}`,
        dirty: `示例状态：未保存 · 修改尚未形成新的保存版本（基线 ${currentVersion}）`,
        saving: `示例状态：保存中 · 等待保存结果，尚未确认新版本`,
        failed: `示例状态：明确保存失败 · 保留修改与基线 ${currentVersion}，提供重试`,
        uncertain: `示例状态：保存结果未知 · 确认同一次请求，不当作失败另发`,
        running: `示例状态：新任务进行中 · 当前仍为 ${currentVersion}，不会被自动替换`,
        ready: `示例状态：新稿 ${pendingVersion} 已生成 · 当前仍为 ${currentVersion}，等待用户选择`
      };
      document.querySelector('#version-status').textContent = statuses[demoState];
      document.querySelector('#version-strip').classList.toggle('warning', ['dirty', 'saving', 'failed', 'uncertain'].includes(demoState));
      document.querySelector('#project-version').textContent = demoState === 'before' ? '尚无首稿 · 示例' : `当前稿 ${currentVersion} · 示例`;
      document.querySelector('#project-meta').textContent = `${chapters[currentChapter].volume} · ${demoState === 'before' ? '生成前大纲与进度示例' : `当前 Word 示例稿 ${currentVersion}`}`;
      document.querySelector('#main-title').textContent = demoState === 'before' ? '大纲与生成进度' : 'Word 文稿';
      document.querySelector('#download-info').textContent = `下载已保存稿 ${currentVersion}（说明）`;
      for (const id of ['edit-word', 'save-info', 'download-info']) document.getElementById(id).disabled = demoState === 'before';
      const notice = document.querySelector('#draft-notice');
      notice.hidden = !['running', 'ready'].includes(demoState);
      if (demoState === 'running') notice.innerHTML = `<p><strong>新任务进行中 · 示例</strong><br>基于指定资料准备新稿，当前 ${currentVersion} 保持可见；现有修改不会被覆盖。此状态不执行真实任务。</p>`;
      if (demoState === 'ready') {
        notice.innerHTML = `<p><strong>新稿 ${pendingVersion} 已生成 · 示例</strong><br>原稿 ${currentVersion} 与人工修改保留。请选择查看新稿，或继续当前稿。</p><button id="view-new-draft" class="primary">查看新稿（示例）</button><button id="keep-current-draft">继续当前稿</button>`;
        document.querySelector('#view-new-draft').onclick = () => { currentVersion = pendingVersion; viewingNewDemo = true; demoState = 'saved'; document.querySelector('#demo-state').value = 'saved'; renderState(); };
        document.querySelector('#keep-current-draft').onclick = () => { demoState = 'saved'; document.querySelector('#demo-state').value = 'saved'; renderState(); };
      }
      renderDocument(); renderContext();
    }
    function renderContext() {
      const chapter = chapters[currentChapter];
      const versionNote = demoState === 'before' ? '尚无正文复核 · 以下为来源要求与资料待补示例' : `当前稿：${currentVersion} · 复核基于：${reviewVersion}${currentVersion !== reviewVersion ? '（旧版本意见，需重新核对）' : ''}`;
      const intro = `<p class="context-title">${versionNote}<br>${chapter.volume} · ${chapter.title}</p>`;
      let body;
      if (currentContext === 'requirements') body = `<div class="info-item"><span class="label">来源要求 · 合成示例</span><p>${chapter.requirement}</p><small>要求与应答分别呈现，不将有章节误作已响应。</small></div>`;
      if (currentContext === 'supports') body = `<div class="info-item"><strong>当前可用依据</strong><p>${chapter.support}</p><small>正式产品需关联真实来源与版本，支持原文定位。</small></div>`;
      if (currentContext === 'gaps') body = `<div class="info-item missing-item"><strong>${chapter.gap}</strong><p>保留对应空位；当前章节及其他可用内容继续展示和交付。</p><button id="locate-gap">${demoState === 'before' ? '定位到大纲位置' : '定位到 Word 位置'}</button></div><p class="inspector-note">补充资料后更新受影响位置，另存新稿。缺口未关闭不等于文件无法生成，也不能标成已经满足要求。</p>`;
      document.querySelector('#inspector-body').innerHTML = intro + body + '<p class="inspector-note">保存后更新目录与业务定位。复核意见保留所基于版本，人工写入内容不自动判定问题已经解决。</p>';
      if (currentContext === 'gaps') document.querySelector('#locate-gap').onclick = locateGap;
    }
    function selectChapter(key) {
      currentChapter = key; currentPage = chapters[key].page;
      document.querySelectorAll('.chapter').forEach(button => {
        const active = button.dataset.chapter === key;
        button.classList.toggle('active', active);
        if (active) button.setAttribute('aria-current', 'true'); else button.removeAttribute('aria-current');
        if (active && !document.querySelector('#chapter-search').value) {
          const list = button.parentElement; list.hidden = false;
          list.previousElementSibling.setAttribute('aria-expanded', 'true');
          list.previousElementSibling.querySelector('span').textContent = '⌄';
        }
      });
      renderState();
    }
    function locateGap() {
      workspace.classList.remove('drawer-open');
      const target = document.getElementById(chapters[currentChapter].target);
      target?.scrollIntoView({behavior: 'smooth', block: 'center'});
      target?.classList.remove('highlight');
      if (target) { void target.offsetWidth; target.classList.add('highlight'); }
    }
    document.querySelectorAll('.chapter').forEach(button => button.onclick = () => selectChapter(button.dataset.chapter));
    document.querySelectorAll('.volume-toggle').forEach(button => button.onclick = () => {
      const list = button.nextElementSibling; list.hidden = !list.hidden;
      button.setAttribute('aria-expanded', String(!list.hidden)); button.querySelector('span').textContent = list.hidden ? '›' : '⌄';
    });
    document.querySelector('#chapter-search').oninput = event => {
      const query = event.target.value.trim().toLowerCase(); let matches = 0;
      document.querySelectorAll('.volume').forEach(volume => {
        let visible = 0;
        volume.querySelectorAll('.chapter').forEach(button => {
          const found = button.textContent.toLowerCase().includes(query); button.hidden = !found;
          button.style.display = found ? '' : 'none'; if (found) { visible++; matches++; }
        });
        volume.hidden = visible === 0;
        if (query && visible) { volume.querySelector('.chapter-list').hidden = false; volume.querySelector('.volume-toggle').setAttribute('aria-expanded', 'true'); volume.querySelector('.volume-toggle span').textContent = '⌄'; }
      });
      document.querySelector('#empty-search').hidden = matches > 0;
    };
    document.querySelectorAll('[data-context]').forEach(button => button.onclick = () => {
      currentContext = button.dataset.context;
      document.querySelectorAll('[data-context]').forEach(tab => { const active = tab === button; tab.classList.toggle('active', active); tab.setAttribute('aria-selected', String(active)); });
      renderContext();
    });
    document.querySelector('#toggle-left').onclick = event => {
      const closed = workspace.classList.toggle('left-closed'); event.currentTarget.textContent = closed ? '›' : '‹';
      event.currentTarget.setAttribute('aria-expanded', String(!closed)); event.currentTarget.setAttribute('aria-label', closed ? '展开章节栏' : '折叠章节栏');
    };
    document.querySelector('#toggle-right').onclick = event => {
      if (matchMedia('(max-width:900px)').matches) workspace.classList.remove('drawer-open');
      else { const closed = workspace.classList.toggle('right-closed'); event.currentTarget.textContent = closed ? '‹' : '›'; event.currentTarget.setAttribute('aria-expanded', String(!closed)); event.currentTarget.setAttribute('aria-label', closed ? '展开核对栏' : '折叠核对栏'); }
    };
    document.querySelector('#open-evidence').onclick = () => workspace.classList.add('drawer-open');
    document.querySelector('#overlay').onclick = () => workspace.classList.remove('drawer-open');
    document.addEventListener('keydown', event => { if (event.key === 'Escape') workspace.classList.remove('drawer-open'); });
    document.querySelector('#edit-word').onclick = () => showDialog('编辑 Word', '<p>正式产品在中心接入 ONLYOFFICE，直接阅读与编辑同一份 Word。目录和右侧业务信息辅助定位，不维护另一份网页正文。</p><p class="dialog-note">本草图只模拟 Word 稿件位置，不包含真实编辑器、保存或业务接口。保存后更新目录与业务定位；复核意见标明所基于版本。</p><p>未保存、保存中和保存失败分别提示。只有确认 DOCX 已持久保存后才显示已保存，不因点击按钮就判定成功。</p>');
    document.querySelector('#new-draft').onclick = () => showDialog('生成新稿的行为说明', '<p>正式产品需明确本次采用的资料快照和更新范围，再另存新稿，例如 v4；原稿 v3 与已有人工修改保留。新任务与新稿通知不会抢占当前 Word。</p><p>首版不自动合并人工 Word 修改。查看新稿前需处理当前稿的未保存修改或未知保存结果，再由用户明确切换。</p><p class="dialog-note">这只是交互说明。本次点击不会创建任务、调用模型或生成任何文件。</p>');
    document.querySelector('#close-dialog').onclick = () => dialog.close();
    dialog.onclick = event => { if (event.target === dialog) { const rect = dialog.getBoundingClientRect(); if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close(); } };
    document.querySelector('#save-info').onclick = () => showDialog('保存行为说明 · 不执行实际保存', '<p>正式产品保存当前 Word。明确保存失败时保留修改并提供重试；结果未知时确认同一次保存请求，不能当作失败另发。未确认写入成功时保留原保存版本和当前编辑现场。</p><p class="dialog-note">保存成功后更新目录与业务定位，复核结论仍标注所基于版本。本次点击仅展示说明，不改变保存状态；可用上方草图控件手动查看各示例。</p>');
    document.querySelector('#download-info').onclick = () => showDialog('下载行为说明 · 不提供示例文件', `<p>正式产品下载明确的已保存 Word 版本，例如当前 ${currentVersion}。未保存修改不应被标成已经包含在下载稿中；保存结果待确认时需明确文件所属版本。</p><p class="dialog-note">本草图不生成或下载文件，不把留空、缺资料或复核待处理当作禁止下载已有文件的条件。</p>`);
    document.querySelector('#demo-state').onchange = event => { demoState = event.target.value; renderState(); };
    if (matchMedia('(max-width:600px)').matches) { workspace.classList.add('left-closed'); const toggle = document.querySelector('#toggle-left'); toggle.textContent = '›'; toggle.setAttribute('aria-expanded', 'false'); toggle.setAttribute('aria-label', '展开章节栏'); }
    renderState();
  </script>
</body>
</html>
