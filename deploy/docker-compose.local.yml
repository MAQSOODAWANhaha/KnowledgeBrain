# Local/LAN override: build retention from the worker image, and terminate
# browser TLS on Caddy. Production compose stays pinned to images.lock.json.
# Do not add Caddy to the release-descriptor five-image contract.
services:
  minio:
    # Docker Hub no longer publishes minio/minio. This image is the same server
    # binary and keeps the compose command `server /data --console-address :9001`.
    image: cgr.dev/chainguard/minio:latest
    user: "0"
  retention:
    image: knowledgebrain-worker:local
  api:
    ports: !override []
  onlyoffice:
    ports: !override []
  caddy:
    image: caddy:2.8.4-alpine
    container_name: knowledgebrain-caddy
    profiles: ["runtime"]
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-28080}:28080"
      - "${ONLYOFFICE_HOST_PORT:-18081}:18081"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
    depends_on:
      api:
        condition: service_healthy
      onlyoffice:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --no-check-certificate https://127.0.0.1:28080/ready >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
