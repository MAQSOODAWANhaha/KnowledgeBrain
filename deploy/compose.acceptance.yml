# yaml-language-server: $schema=schemas/compose-spec.json
# CI-only immutable application-image override. The acceptance driver passes
# --no-build, so Compose uses the exact pre-built image IDs below.
services:
  migrate:
    image: ${KB_ACCEPT_RUNTIME_ID:?acceptance application image ID is required}
    pull_policy: never
    entrypoint: ["/usr/local/bin/migrator"]
  api:
    image: ${KB_ACCEPT_RUNTIME_ID:?acceptance application image ID is required}
    pull_policy: never
    entrypoint: ["/usr/local/bin/api"]
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", ":> /dev/tcp/127.0.0.1/8080"]
      interval: 2s
      timeout: 1s
      retries: 10
  worker:
    image: ${KB_ACCEPT_RUNTIME_ID:?acceptance application image ID is required}
    pull_policy: never
    entrypoint: ["/usr/local/bin/worker"]
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", ":> /dev/tcp/127.0.0.1/8081"]
      interval: 2s
      timeout: 1s
      retries: 10
  retention:
    image: ${KB_ACCEPT_RUNTIME_ID:?acceptance application image ID is required}
    pull_policy: never
    entrypoint: ["/usr/local/bin/retention"]
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", ":> /dev/tcp/127.0.0.1/8082"]
      interval: 2s
      timeout: 1s
      retries: 10
  docreader:
    image: ${KB_ACCEPT_DOCREADER_ID:?acceptance DocReader image ID is required}
    pull_policy: never
    environment:
      DOCREADER_GRPC_PORT: 50051
      MAX_FILE_SIZE_MB: 50
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket;s=socket.create_connection(('127.0.0.1',50051),2);s.close()\""]
      interval: 2s
      timeout: 3s
      retries: 30
