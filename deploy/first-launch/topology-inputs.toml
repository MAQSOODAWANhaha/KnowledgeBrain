# Signed Compose INPUT CLOSURE. Declarations only; do not fill topology_sha256.
format_version = 1
contract = "bid-matching-v1"
# Exact ordered compose inputs:
# - docker-compose.yml: root include-only delegator
# - deploy/docker-compose.yml: final service definition
files = [
  "docker-compose.yml",
  "deploy/docker-compose.yml",
]
reject_implicit_override = true
notes = "Any docker-compose.override.yml, extra -f, or COMPOSE_FILE not in this list is refuse."
