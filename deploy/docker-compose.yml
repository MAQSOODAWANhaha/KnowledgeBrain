name: knowledgebrain

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:-postgres://knowledgebrain:knowledgebrain@postgres:5432/knowledgebrain}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  OBJECT_DIR: ${OBJECT_DIR:-/data/objects}
  JWT_SECRET: ${JWT_SECRET:-change-me}
  KNOWLEDGEBRAIN_BOOTSTRAP_KEY: ${KNOWLEDGEBRAIN_BOOTSTRAP_KEY:-}
  DOCREADER_ADDR: ${DOCREADER_ADDR:-docreader:50051}
  KNOWLEDGEBRAIN_S3_BUCKET: ${KNOWLEDGEBRAIN_S3_BUCKET:-knowledgebrain}
  KNOWLEDGEBRAIN_S3_ENDPOINT: ${KNOWLEDGEBRAIN_S3_ENDPOINT:-http://minio:9000}
  KNOWLEDGEBRAIN_S3_ACCESS_KEY: ${KNOWLEDGEBRAIN_S3_ACCESS_KEY:-minioadmin}
  KNOWLEDGEBRAIN_S3_SECRET_KEY: ${KNOWLEDGEBRAIN_S3_SECRET_KEY:-minioadmin}
  KNOWLEDGEBRAIN_S3_REGION: ${KNOWLEDGEBRAIN_S3_REGION:-us-east-1}
  KNOWLEDGEBRAIN_NEO4J_HTTP_URL: ${KNOWLEDGEBRAIN_NEO4J_HTTP_URL:-}
  KNOWLEDGEBRAIN_NEO4J_USERNAME: ${KNOWLEDGEBRAIN_NEO4J_USERNAME:-neo4j}
  KNOWLEDGEBRAIN_NEO4J_PASSWORD: ${KNOWLEDGEBRAIN_NEO4J_PASSWORD:-knowledgebrain}
  KNOWLEDGEBRAIN_EMBEDDING_BASE_URL: ${KNOWLEDGEBRAIN_EMBEDDING_BASE_URL:-}
  KNOWLEDGEBRAIN_EMBEDDING_API_KEY: ${KNOWLEDGEBRAIN_EMBEDDING_API_KEY:-${EMBEDDING_API_KEY:-}}
  KNOWLEDGEBRAIN_EMBEDDING_MODEL: ${KNOWLEDGEBRAIN_EMBEDDING_MODEL:-${EMBEDDING_MODEL:-}}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  KNOWLEDGEBRAIN_CHAT_BASE_URL: ${KNOWLEDGEBRAIN_CHAT_BASE_URL:-}
  KNOWLEDGEBRAIN_CHAT_API_KEY: ${KNOWLEDGEBRAIN_CHAT_API_KEY:-${LLM_API_KEY:-}}
  KNOWLEDGEBRAIN_CHAT_MODEL: ${KNOWLEDGEBRAIN_CHAT_MODEL:-${LLM_MODEL:-}}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  KNOWLEDGEBRAIN_VLM_BASE_URL: ${KNOWLEDGEBRAIN_VLM_BASE_URL:-}
  KNOWLEDGEBRAIN_VLM_API_KEY: ${KNOWLEDGEBRAIN_VLM_API_KEY:-${LLM_API_KEY:-}}
  KNOWLEDGEBRAIN_VLM_MODEL: ${KNOWLEDGEBRAIN_VLM_MODEL:-${LLM_MODEL:-}}
  KNOWLEDGEBRAIN_MINERU_ENDPOINT: ${KNOWLEDGEBRAIN_MINERU_ENDPOINT:-}
  KNOWLEDGEBRAIN_PADDLE_ENDPOINT: ${KNOWLEDGEBRAIN_PADDLE_ENDPOINT:-}
  KNOWLEDGEBRAIN_CORE_CONCURRENCY: ${KNOWLEDGEBRAIN_CORE_CONCURRENCY:-8}
  KNOWLEDGEBRAIN_POSTPROCESS_CONCURRENCY: ${KNOWLEDGEBRAIN_POSTPROCESS_CONCURRENCY:-2}
  KNOWLEDGEBRAIN_ENRICHMENT_CONCURRENCY: ${KNOWLEDGEBRAIN_ENRICHMENT_CONCURRENCY:-12}
  KNOWLEDGEBRAIN_MAINTENANCE_CONCURRENCY: ${KNOWLEDGEBRAIN_MAINTENANCE_CONCURRENCY:-4}
  KNOWLEDGEBRAIN_SHARED_CONCURRENCY: ${KNOWLEDGEBRAIN_SHARED_CONCURRENCY:-6}
  KNOWLEDGEBRAIN_WIKI_CONCURRENCY: ${KNOWLEDGEBRAIN_WIKI_CONCURRENCY:-8}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledgebrain-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledgebrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledgebrain}
      POSTGRES_DB: ${POSTGRES_DB:-knowledgebrain}
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledgebrain} -d ${POSTGRES_DB:-knowledgebrain}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: knowledgebrain-redis
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  neo4j:
    image: neo4j:5.26
    container_name: knowledgebrain-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/knowledgebrain}
    ports:
      - "${NEO4J_BOLT_PORT:-17687}:7687"
      - "${NEO4J_HTTP_PORT:-17474}:7474"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: knowledgebrain-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_HOST_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  docreader:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.docreader
    image: knowledgebrain-docreader:local
    container_name: knowledgebrain-docreader
    environment:
      DOCREADER_GRPC_PORT: ${DOCREADER_GRPC_PORT:-50051}
      MAX_FILE_SIZE_MB: 50
    ports:
      - "${DOCREADER_HOST_PORT:-15051}:50051"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket;s=socket.create_connection(('127.0.0.1',50051),2);s.close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust
      args:
        BIN: api
    image: knowledgebrain-api:local
    container_name: knowledgebrain-api
    environment:
      <<: *app-env
      API_PORT: ${API_PORT:-8080}
    ports:
      - "${API_HOST_PORT:-18080}:8080"
    volumes:
      - objects:/data/objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust
      args:
        BIN: worker
    image: knowledgebrain-worker:local
    container_name: knowledgebrain-worker
    environment:
      <<: *app-env
    volumes:
      - objects:/data/objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docreader:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
  minio-data:
  objects:
