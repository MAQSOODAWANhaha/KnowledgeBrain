name: knowledgebrain

x-app-env: &app-env
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  OBJECT_DIR: ${OBJECT_DIR:-/data/objects}
  JWT_SECRET: ${JWT_SECRET:-change-me}
  KNOWLEDGEBRAIN_BOOTSTRAP_KEY: ${KNOWLEDGEBRAIN_BOOTSTRAP_KEY:-}
  KNOWLEDGEBRAIN_LDAP_URL: ${KNOWLEDGEBRAIN_LDAP_URL:-}
  KNOWLEDGEBRAIN_LDAP_BIND_DN: ${KNOWLEDGEBRAIN_LDAP_BIND_DN:-uid={user},ou=people,dc=example,dc=com}
  DOCREADER_ADDR: ${DOCREADER_ADDR:-docreader:50051}
  KNOWLEDGEBRAIN_S3_BUCKET: ${KNOWLEDGEBRAIN_S3_BUCKET:-knowledgebrain}
  KNOWLEDGEBRAIN_S3_ENDPOINT: ${KNOWLEDGEBRAIN_S3_ENDPOINT:-http://minio:9000}
  KNOWLEDGEBRAIN_S3_ACCESS_KEY: ${KNOWLEDGEBRAIN_S3_ACCESS_KEY:-minioadmin}
  KNOWLEDGEBRAIN_S3_SECRET_KEY: ${KNOWLEDGEBRAIN_S3_SECRET_KEY:-minioadmin}
  KNOWLEDGEBRAIN_S3_REGION: ${KNOWLEDGEBRAIN_S3_REGION:-us-east-1}
  KNOWLEDGEBRAIN_NEO4J_HTTP_URL: ${KNOWLEDGEBRAIN_NEO4J_HTTP_URL:-}
  KNOWLEDGEBRAIN_NEO4J_USERNAME: ${KNOWLEDGEBRAIN_NEO4J_USERNAME:-neo4j}
  KNOWLEDGEBRAIN_NEO4J_PASSWORD: ${KNOWLEDGEBRAIN_NEO4J_PASSWORD:-knowledgebrain}
  KNOWLEDGEBRAIN_EMBEDDING_BASE_URL: ${KNOWLEDGEBRAIN_EMBEDDING_BASE_URL:-}
  KNOWLEDGEBRAIN_EMBEDDING_API_KEY: ${KNOWLEDGEBRAIN_EMBEDDING_API_KEY:-${EMBEDDING_API_KEY:-}}
  KNOWLEDGEBRAIN_EMBEDDING_MODEL: ${KNOWLEDGEBRAIN_EMBEDDING_MODEL:-${EMBEDDING_MODEL:-}}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  KNOWLEDGEBRAIN_CHAT_BASE_URL: ${KNOWLEDGEBRAIN_CHAT_BASE_URL:-}
  KNOWLEDGEBRAIN_CHAT_API_KEY: ${KNOWLEDGEBRAIN_CHAT_API_KEY:-${LLM_API_KEY:-}}
  KNOWLEDGEBRAIN_CHAT_MODEL: ${KNOWLEDGEBRAIN_CHAT_MODEL:-${LLM_MODEL:-}}
  BID_EXTRACT_MODE: ${BID_EXTRACT_MODE:-hybrid}
  BID_EXTRACT_MODEL_ID: ${BID_EXTRACT_MODEL_ID:-${KNOWLEDGEBRAIN_CHAT_MODEL:-${LLM_MODEL:-}}}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  KNOWLEDGEBRAIN_VLM_BASE_URL: ${KNOWLEDGEBRAIN_VLM_BASE_URL:-}
  KNOWLEDGEBRAIN_VLM_API_KEY: ${KNOWLEDGEBRAIN_VLM_API_KEY:-${LLM_API_KEY:-}}
  KNOWLEDGEBRAIN_VLM_MODEL: ${KNOWLEDGEBRAIN_VLM_MODEL:-${LLM_MODEL:-}}
  KNOWLEDGEBRAIN_MINERU_ENDPOINT: ${KNOWLEDGEBRAIN_MINERU_ENDPOINT:-}
  KNOWLEDGEBRAIN_PADDLE_ENDPOINT: ${KNOWLEDGEBRAIN_PADDLE_ENDPOINT:-}
  KNOWLEDGEBRAIN_CORE_CONCURRENCY: ${KNOWLEDGEBRAIN_CORE_CONCURRENCY:-8}
  KNOWLEDGEBRAIN_POSTPROCESS_CONCURRENCY: ${KNOWLEDGEBRAIN_POSTPROCESS_CONCURRENCY:-2}
  KNOWLEDGEBRAIN_ENRICHMENT_CONCURRENCY: ${KNOWLEDGEBRAIN_ENRICHMENT_CONCURRENCY:-12}
  KNOWLEDGEBRAIN_MAINTENANCE_CONCURRENCY: ${KNOWLEDGEBRAIN_MAINTENANCE_CONCURRENCY:-4}
  KNOWLEDGEBRAIN_SHARED_CONCURRENCY: ${KNOWLEDGEBRAIN_SHARED_CONCURRENCY:-6}
  KNOWLEDGEBRAIN_WIKI_CONCURRENCY: ${KNOWLEDGEBRAIN_WIKI_CONCURRENCY:-8}
  RUST_LOG: ${RUST_LOG:-info}
  NO_COLOR: ${NO_COLOR:-1}

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledgebrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledgebrain}
      POSTGRES_DB: ${POSTGRES_DB:-knowledgebrain}
      KNOWLEDGEBRAIN_MIGRATOR_PASSWORD: ${KNOWLEDGEBRAIN_MIGRATOR_PASSWORD:-migrator-change-me}
      KNOWLEDGEBRAIN_FIRST_LAUNCH_VERIFIER_PASSWORD: ${KNOWLEDGEBRAIN_FIRST_LAUNCH_VERIFIER_PASSWORD:-verifier-change-me}
      KNOWLEDGEBRAIN_API_DB_PASSWORD: ${KNOWLEDGEBRAIN_API_DB_PASSWORD:-api-change-me}
      KNOWLEDGEBRAIN_WORKER_DB_PASSWORD: ${KNOWLEDGEBRAIN_WORKER_DB_PASSWORD:-worker-change-me}
      KNOWLEDGEBRAIN_RETENTION_DB_PASSWORD: ${KNOWLEDGEBRAIN_RETENTION_DB_PASSWORD:-retention-change-me}
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledgebrain} -d ${POSTGRES_DB:-knowledgebrain}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  neo4j:
    image: neo4j:5.26@sha256:89d577f2e49606de76441eca8cf7a0fe88e594cbaac4d2a3d86c6e59676e2b1e
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/knowledgebrain}
    ports:
      - "${NEO4J_BOLT_PORT:-17687}:7687"
      - "${NEO4J_HTTP_PORT:-17474}:7474"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_HOST_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  docreader:
    profiles: ["runtime"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.docreader
    image: knowledgebrain-docreader:local@sha256:72a50677badec74ed84c173c6098e139c0ab9b58281f20212e60610bbe0dbb97
    environment:
      DOCREADER_GRPC_PORT: ${DOCREADER_GRPC_PORT:-50051}
      MAX_FILE_SIZE_MB: 50
    ports:
      - "${DOCREADER_HOST_PORT:-15051}:50051"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket;s=socket.create_connection(('127.0.0.1',50051),2);s.close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  migrate:
    profiles: ["first-launch"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust
      args:
        BIN: migrator
    image: knowledgebrain-migrator:local
    environment:
      DATABASE_URL: postgres://kb_migrator:${KNOWLEDGEBRAIN_MIGRATOR_PASSWORD:-migrator-change-me}@postgres:5432/${POSTGRES_DB:-knowledgebrain}
      KNOWLEDGEBRAIN_BOOTSTRAP_ADMIN_DATABASE_URL: postgres://${POSTGRES_USER:-knowledgebrain}:${POSTGRES_PASSWORD:-knowledgebrain}@postgres:5432/${POSTGRES_DB:-knowledgebrain}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  first-launch-verifier:
    profiles: ["first-launch"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust
      args:
        BIN: first-launch-verifier
    image: knowledgebrain-first-launch-verifier:local
    environment:
      DATABASE_URL: postgres://kb_first_launch_verifier:${KNOWLEDGEBRAIN_FIRST_LAUNCH_VERIFIER_PASSWORD:-verifier-change-me}@postgres:5432/${POSTGRES_DB:-knowledgebrain}
      KNOWLEDGEBRAIN_APP_OWNER: kb_app_owner
      KNOWLEDGEBRAIN_BOOTSTRAP_OWNER: ${POSTGRES_USER:-knowledgebrain}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    profiles: ["runtime"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust
      args:
        BIN: api
    image: knowledgebrain-api:local@sha256:30a9535e1fa6a139ebe67d7612d144eff75eea3558d621ae003385c73879dd9b
    environment:
      <<: *app-env
      DATABASE_URL: postgres://kb_runtime_api:${KNOWLEDGEBRAIN_API_DB_PASSWORD:-api-change-me}@postgres:5432/${POSTGRES_DB:-knowledgebrain}
      API_PORT: ${API_PORT:-8080}
      KNOWLEDGEBRAIN_WEB_ROOT: ${KNOWLEDGEBRAIN_WEB_ROOT:-/web}
    ports:
      - "${API_HOST_PORT:-18080}:8080"
    restart: unless-stopped
    volumes:
      - objects:/data/objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    profiles: ["runtime"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust
      args:
        BIN: worker
    image: knowledgebrain-worker:local@sha256:5d2715634560254f7c975b5c2a35bc73b72a09ec7926696d91d0dbaa9be6d256
    environment:
      <<: *app-env
      DATABASE_URL: postgres://kb_runtime_worker:${KNOWLEDGEBRAIN_WORKER_DB_PASSWORD:-worker-change-me}@postgres:5432/${POSTGRES_DB:-knowledgebrain}
    restart: unless-stopped
    volumes:
      - objects:/data/objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docreader:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  retention:
    profiles: ["runtime"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rust
      args:
        BIN: retention
    image: knowledgebrain-retention:local
    environment:
      <<: *app-env
      DATABASE_URL: postgres://kb_runtime_retention:${KNOWLEDGEBRAIN_RETENTION_DB_PASSWORD:-retention-change-me}@postgres:5432/${POSTGRES_DB:-knowledgebrain}
      RETENTION_PROBE_ADDR: 0.0.0.0:8082
    restart: unless-stopped
    volumes:
      - objects:/data/objects
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
  minio-data:
  objects:
