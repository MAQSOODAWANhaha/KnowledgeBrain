[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docreader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.20",
    "grpcio>=1.83.0",
    "grpcio-health-checking>=1.83.0",
    "grpcio-tools>=1.83.0",
    "lxml>=6.1.1",
    "fonttools>=4.61.0",
    "markdownify>=1.2.3",
    "markitdown[docx,pdf,xls,xlsx]>=0.1.7",
    "numpy>=2.0.0",
    "opendataloader-pdf>=2.5.0",
    "openpyxl>=3.1.5",
    "pandas>=2.0.0,<3",
    "xlrd>=2.0.0",
    "pillow>=12.3.0",
    "playwright>=1.62.0",
    "protobuf>=7.35.1,<8",
    "pydantic>=2.13.4",
    "pypdf>=6.16.1",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "requests>=2.34.2",
    "textract==1.5.0",
    "trafilatura>=2.2.0",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "dramatiq[redis]>=1.18,<2",
    "openai>=2,<3",
    "httpx>=0.28,<1",
    "tiktoken>=0.9,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1,<2",
    "xlsxwriter>=3.2.9",
]

[tool.setuptools]
package-dir = { docreader = "." }
packages = [
    "docreader",
    "docreader.models",
    "docreader.parser",
    "docreader.proto",
    "docreader.utils",
    "docreader.llm",
    "docreader.tender",
    "docreader.tender.evidence",
    "docreader.tender.requirements",
    "docreader.tender.planning",
    "docreader.tender.checks",
    "docreader.tender.prompts",
    "docreader.workflow",
    "docreader.jobs",
    "docreader.integrations",
]

[tool.setuptools.package-data]
"docreader.tender.prompts" = ["*.md"]

[tool.pyright]
include = ["."]
exclude = ["**/__pycache__", ".venv", "proto"]
stubPath = "typings"
extraPaths = ["..", "services"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
pythonpath = [".."]
asyncio_mode = "auto"
markers = ["integration: requires real PostgreSQL and Redis"]

[tool.ruff]
target-version = "py311"
extend-exclude = [".venv", "proto"]

[tool.ruff.lint]
select = ["F", "E", "W"]
ignore = ["E501"]
